<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Easy Maths form definition</title>
  </head>
  <body>
    <!-- Static form definition used by Netlify's deploy-time form detection. -->
    <form name="session-enquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="session-enquiry" />
      <input type="hidden" name="subject" value="New €25 Maths Clarity Session enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="role" />
      <input type="email" name="email" />
      <input type="tel" name="mobile" />
      <input type="text" name="studentStage" />
      <input type="text" name="lessonFormat" />
      <textarea name="helpWanted"></textarea>
      <input type="text" name="attribution" />
      <input type="text" name="consent" />
    </form>
  </body>
</html>
